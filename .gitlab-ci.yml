stages:
  - run
  


build-services:
  stage: run
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - cd mgl7230_tp3_part1
    - mvn clean install 
    - cd service
    - nohup mvn exec:java &  
    - cd ../../mgl7230_tp3_part2
    - mvn clean install 
    - cd service
    - nohup mvn exec:java &  
  artifacts:
    paths:
      - mgl7230_tp3_part1/service/target/
      - mgl7230_tp3_part2/service/target/
    expire_in: 1 hour



     